name: Deploy Ledger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_AKAHU_APP_TOKEN: ${{ secrets.AKAHU_APP_TOKEN }}
          DEPLOY_AKAHU_USER_TOKEN: ${{ secrets.AKAHU_USER_TOKEN }}
          DEPLOY_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_LEDGER_ADMIN_PASSWORD: ${{ secrets.LEDGER_ADMIN_PASSWORD }}
          DEPLOY_LEDGER_PASSWORD_HASH: ${{ secrets.LEDGER_PASSWORD_HASH }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_AKAHU_APP_TOKEN,DEPLOY_AKAHU_USER_TOKEN,DEPLOY_DISCORD_WEBHOOK_URL,DEPLOY_LEDGER_ADMIN_PASSWORD,DEPLOY_LEDGER_PASSWORD_HASH
          script: |
            set -e
            APP_DIR=~/finance/ledger
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              mkdir -p ~/finance
              git clone https://github.com/elaw142/Ledger.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f .env ]; then
              umask 077
              LEDGER_BOOTSTRAP_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
              LEDGER_BOOTSTRAP_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              {
                echo "LEDGER_PUBLIC_URL=https://ledger.emlw.dev/"
                echo "LEDGER_DATABASE=/home/opc/finance/ledger/ledger.sqlite3"
                echo "LEDGER_SECRET_KEY=$LEDGER_BOOTSTRAP_SECRET"
                echo "LEDGER_ADMIN_PASSWORD=$LEDGER_BOOTSTRAP_PASSWORD"
                echo "AKAHU_APP_TOKEN="
                echo "AKAHU_USER_TOKEN="
                echo "DISCORD_WEBHOOK_URL="
              } > .env
            fi
            python3 - <<'PY'
            import os
            import secrets
            from pathlib import Path

            path = Path(".env")
            values = {}
            for line in path.read_text().splitlines():
                if "=" in line and not line.lstrip().startswith("#"):
                    key, value = line.split("=", 1)
                    values[key] = value

            values.setdefault("LEDGER_PUBLIC_URL", "https://ledger.emlw.dev/")
            values.setdefault("LEDGER_DATABASE", "/home/opc/finance/ledger/ledger.sqlite3")
            values["LEDGER_SECRET_KEY"] = values.get("LEDGER_SECRET_KEY") or secrets.token_urlsafe(48)
            values["LEDGER_ADMIN_PASSWORD"] = (
                os.environ.get("DEPLOY_LEDGER_ADMIN_PASSWORD")
                or values.get("LEDGER_ADMIN_PASSWORD")
                or secrets.token_urlsafe(24)
            )
            if os.environ.get("DEPLOY_LEDGER_PASSWORD_HASH"):
                values["LEDGER_PASSWORD_HASH"] = os.environ["DEPLOY_LEDGER_PASSWORD_HASH"]
            for key, env_key in {
                "AKAHU_APP_TOKEN": "DEPLOY_AKAHU_APP_TOKEN",
                "AKAHU_USER_TOKEN": "DEPLOY_AKAHU_USER_TOKEN",
                "DISCORD_WEBHOOK_URL": "DEPLOY_DISCORD_WEBHOOK_URL",
            }.items():
                if os.environ.get(env_key):
                    values[key] = os.environ[env_key]
                else:
                    values.setdefault(key, "")

            order = [
                "LEDGER_PUBLIC_URL",
                "LEDGER_DATABASE",
                "LEDGER_SECRET_KEY",
                "LEDGER_ADMIN_PASSWORD",
                "LEDGER_PASSWORD_HASH",
                "AKAHU_APP_TOKEN",
                "AKAHU_USER_TOKEN",
                "DISCORD_WEBHOOK_URL",
            ]
            keys = [key for key in order if key in values] + sorted(set(values) - set(order))
            path.write_text("".join(f"{key}={values[key]}\n" for key in keys))
            PY
            set -a
            . ./.env
            set +a
            sudo install -m 600 .env /etc/ledger.env
            python3 -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -e .
            .venv/bin/ledger init-db
            .venv/bin/ledger detect-transfers
            sudo cp deploy/ledger-*.service deploy/ledger-*.timer /etc/systemd/system/
            if command -v caddy >/dev/null 2>&1; then
              if [ -d /etc/caddy/conf.d ]; then
                sudo cp deploy/caddy.conf /etc/caddy/conf.d/ledger.conf
              elif [ -f /etc/caddy/Caddyfile ] && ! sudo grep -q "ledger.emlw.dev" /etc/caddy/Caddyfile; then
                cat deploy/caddy.conf | sudo tee -a /etc/caddy/Caddyfile >/dev/null
              fi
              sudo systemctl reload caddy || sudo systemctl restart caddy || true
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable ledger-web
            sudo systemctl enable --now ledger-sync.timer ledger-review-notify.timer
            sudo systemctl disable --now finance-importer || true
            sudo chcon -R -t bin_t .venv/bin || true
            if ! sudo systemctl restart ledger-web; then
              sudo systemctl status ledger-web --no-pager || true
              sudo journalctl -u ledger-web -n 80 --no-pager || true
              exit 1
            fi
